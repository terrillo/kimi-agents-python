[project]
name = "kimi-agents-python"
version = "1.1.0"
description = "A typed Python client for the Kimi (Moonshot) API, built on httpx and pydantic"
readme = "README.md"
authors = [
    { name = "Terrillo Walls", email = "terrillo@terrillo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# `pip install kimi-agents-python[http2]` enables HTTP/2 multiplexing in
# the default client. The client auto-detects `h2` and turns HTTP/2 on
# when it's importable; the flag can be forced via `http2=` on the client.
http2 = ["h2>=4.1"]

[project.scripts]
kimi-agents-python = "kimi_agents_python:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/kimi_agents_python"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
